[package]
name = "minibar"
version = "0.1.0"
edition = "2024"

[dependencies]
downcast-rs = "2.0.2"
iced = { 
    version = "0.14.0",
    default-features = false,
    features = [
        "advanced",
        "tiny-skia",
        "wayland",
        "thread-pool",
    ]
}
iced_layershell = { 
    version = "0.19.1",
    default-features = false,
}
serde_json = "1.0.151"
toml = {
    version = "1.1.4",
    default-features = false,
    features = [ "serde", "parse" ]
}

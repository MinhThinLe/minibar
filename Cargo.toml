[package]
name = "minibar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = {
    version = "0.4.45",
    default-features = false,
    features = [ "clock" ]
}
downcast-rs = "1.2.1"
iced = { 
    git = "https://github.com/pop-os/iced.git",
    branch = "master",
    version = "0.14.0",
    default-features = false,
    features = [
        "tiny-skia",
        "wayland",
        "winit",
    ]
}
log = "0.4.34"

serde_json = "1.0.151"

smithay-client-toolkit = {
    version = "0.20.0",
    default-features = false,
}

toml = {
    version = "1.1.4",
    default-features = false,
    features = [ "serde", "parse" ]
}
